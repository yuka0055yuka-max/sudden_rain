, html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>幻想都市PWA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #111; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="kyoto"></canvas>
<script>
const c = document.getElementById("kyoto"), x = c.getContext("2d");
function resize() {
  c.width = window.innerWidth;
  c.height = window.innerHeight;
  init();
}
window.addEventListener("resize", resize);
resize();

let rain = [], buildings = [], lightning = [], flash = 0;

function init() {
  rain = [];
  for (let i = 0; i < 150; i++) {
    rain.push({ x: Math.random() * c.width, y: Math.random() * c.height, s: 3 + Math.random() * 3 });
  }
  buildings = [];
  for (let i = 0; i < c.width; i += 80) {
    let h = 100 + Math.random() * 100;
    buildings.push({ x: i, y: c.height - 300 - h, w: 60, h: h });
  }
}

function drawBackground() {
  x.fillStyle = "#1a1a1a";
  x.fillRect(0, 0, c.width, c.height);
  buildings.forEach(b => {
    x.fillStyle = "#222";
    x.fillRect(b.x, b.y, b.w, b.h);
    for (let j = 0; j < 5; j++) {
      x.fillStyle = Math.random() > 0.5 ? "#0ff" : "#f0f";
      x.fillRect(b.x + 10, b.y + 20 + j * 20, 10, 10);
    }
  });
}

function drawRain() {
  x.strokeStyle = "#88ccff";
  x.lineWidth = 1;
  rain.forEach(r => {
    x.beginPath();
    x.moveTo(r.x, r.y);
    x.lineTo(r.x, r.y + 10);
    x.stroke();
    r.y += r.s;
    if (r.y > c.height) {
      r.y = -10;
      r.x = Math.random() * c.width;
    }
  });
}

function drawLightning() {
  if (Math.random() < 0.01) {
    flash = 5;
    let bx = buildings[Math.floor(Math.random() * buildings.length)].x + 30;
    lightning = [{ x: bx, y: 0 }];
  }
  if (flash > 0) {
    x.fillStyle = "rgba(255,255,255,0.2)";
    x.fillRect(0, 0, c.width, c.height);
    flash--;
    let last = lightning[lightning.length - 1];
    if (last.y < c.height) {
      let nx = last.x + (Math.random() * 40 - 20);
      let ny = last.y + 30;
      lightning.push({ x: nx, y: ny });
    }
    x.strokeStyle = "#fff";
    x.lineWidth = 2;
    x.beginPath();
    x.moveTo(lightning[0].x, lightning[0].y);
    for (let i = 1; i < lightning.length; i++) {
      x.lineTo(lightning[i].x, lightning[i].y);
    }
    x.stroke();
  }
}

function loop() {
  drawBackground();
  drawRain();
  drawLightning();
  requestAnimationFrame(loop);
}
loop();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
