<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>幻想都市</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#222222">
  <style>
    html, body { margin: 0; padding: 0; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="kyoto"></canvas>
  <script>
    const c = document.getElementById("kyoto"),
          x = c.getContext("2d");
    let rain = [], buildings = [], lightning = [], flash = 0, cars = [];

    function resize() {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      init();
    }
    window.addEventListener("resize", resize);
    resize();

    function init() {
      rain = Array.from({ length: 150 }, () => ({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        s: 3 + Math.random() * 3
      }));

      buildings = [];
      for (let i = 0; i < c.width; i += 80) {
        const h = 100 + Math.random() * 100;
        buildings.push({ x: i, y: c.height - 300 - h, w: 60, h });
      }

      cars = Array.from({ length: 5 }, () => ({
        x: Math.random() * c.width,
        y: c.height - 80,
        w: 40, h: 20,
        s: 1 + Math.random() * 2,
        d: Math.random() > 0.5 ? 1 : -1
      }));
    }

    function drawBackground() {
      x.fillStyle = "#1a1a1a";
      x.fillRect(0, 0, c.width, c.height);

      buildings.forEach(b => {
        x.fillStyle = "#222";
        x.fillRect(b.x, b.y, b.w, b.h);
        for (let j = 0; j < 5; j++) {
          x.fillStyle = Math.random() > 0.5 ? "#0ff" : "#f0f";
          x.fillRect(b.x + 10, b.y + 20 + j * 20, 10, 10);
        }
      });

      x.fillStyle = "#fff";
      x.font = "24px sans-serif";
      x.fillText("幻想都市 – minimal immortal", 20, 40);
    }

    function drawRain() {
      x.strokeStyle = "#88ccff";
      x.lineWidth = 1;
      rain.forEach(r => {
        x.beginPath();
        x.moveTo(r.x, r.y);
        x.lineTo(r.x, r.y + 10);
        x.stroke();
        r.y += r.s;
        if (r.y > c.height) {
          r.y = -10;
          r.x = Math.random() * c.width;
        }
      });
    }

    function drawLightning() {
      if (Math.random() < 0.01) {
        flash = 5;
        const bx = buildings[Math.floor(Math.random() * buildings.length)].x + 30;
        lightning = [{ x: bx, y: 0 }];
      }
      if (flash > 0) {
        x.fillStyle = "rgba(255,255,255,0.2)";
        x.fillRect(0, 0, c.width, c.height);
        flash--;
        const last = lightning[lightning.length - 1];
        if (last.y < c.height) {
          const nx = last.x + (Math.random() * 40 - 20),
                ny = last.y + 30;
          lightning.push({ x: nx, y: ny });
        }
        x.strokeStyle = "#fff";
        x.lineWidth = 2;
        x.beginPath();
        x.moveTo(lightning[0].x, lightning[0].y);
        lightning.forEach(p => x.lineTo(p.x, p.y));
        x.stroke();
      }
    }

    function drawCars() {
      cars.forEach(car => {
        x.fillStyle = "#ff4444";
        x.fillRect(car.x, car.y, car.w, car.h);
        x.fillStyle = "#222";
        x.fillRect(car.x + 5, car.y + 5, 10, 10);
        car.x += car.s * car.d;
        if (car.x < -car.w || car.x > c.width + car.w) car.d *= -1;
      });
    }

    function loop() {
      drawBackground();
      drawRain();
      drawLightning();
      drawCars();
      requestAnimationFrame(loop);
    }
    loop();

    // PWA：Service Worker登録
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
               .register('/service-worker.js')
               .catch(console.error);
    }
  </script>
</body>
</html>
